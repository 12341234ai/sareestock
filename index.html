<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7dce6">
  <meta name="description" content="Arunika — a private, local saree offer and gallery organizer.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>Arunika — Saree Organizer</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div><div class="brand-name">Arunika</div><div class="brand-tag">Every saree has a story. Every detail has a place.</div></div>
    </div>
    <button class="mobile-menu" id="menuToggle" aria-label="Open navigation">☰</button>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-caption">WORKSPACE</div>
      <nav id="nav">
        <button class="nav-btn active" data-page="dashboard">⌂ <span>Dashboard</span></button>
        <button class="nav-btn" data-page="groups">▦ <span>Groups</span></button>
        <button class="nav-btn" data-page="add">＋ <span>Add Sarees</span></button>
        <button class="nav-btn" data-page="gallery">▧ <span>Gallery</span></button>
        <button class="nav-btn" data-page="search">⌕ <span>Photo Search</span></button>
        <button class="nav-btn" data-page="help">? <span>How to Use</span></button>
        <button class="nav-btn" data-page="settings">⚙ <span>Settings</span></button>
      </nav>
      <div class="dedication"><span>MADE WITH LOVE FOR</span><strong>Aruna, Nainika,<br>Darshi & Kishore</strong></div>
    </aside>
    <main class="main" id="main">
      <div id="pageContent"></div>
      <footer>Arunika · Your saree records stay on this device</footer>
    </main>
  </div>
  <input type="file" id="restoreFile" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="modal"><div class="modal-inner"><button class="modal-close" id="modalClose" aria-label="Close">×</button><div id="modalContent"></div></div></dialog>
  <script src="./app.js"></script>
</body>
</html>
